#
# Every quality gate on Linux, the tests on Windows as well and, before a change
# reaches main, on macOS, and the checks of the dependencies. Actions are pinned
# to a commit; the comment after each one names the release that commit belongs
# to.
#
# The gates are spread over jobs that run side by side, so that a change waits
# for the slowest of them and not for their sum. What `npm run verify` runs in
# one go locally is run here in parts: the static checks, the Rust lints and
# the tests.

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A runner builds once and is thrown away. Incremental compilation and debug
  # information only cost time and room in the cache there; neither changes
  # what is compiled, linted or tested.
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  NODE_VERSION: '24'
  # The licence checker, at the version the development shell provides.
  REUSE_VERSION: '6.2.0'
  # Libraries the WebView links against on Linux.
  LINUX_PACKAGES: >-
    libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev
    libayatana-appindicator3-dev librsvg2-dev
  # Where the downloaded packages of those libraries are kept between runs,
  # below the home directory of the runner.
  LINUX_PACKAGE_ARCHIVES: apt-archives

jobs:
  static:
    name: Static checks (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - name: Check the licence of every file
        run: |
          pipx install "reuse==$REUSE_VERSION"
          npm run license:check

  lint:
    name: Rust lints (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # The same two steps as in the tests below: the packages are downloaded
      # once and installed from the cache afterwards. The package manager
      # still decides what is installed and fetches whatever the cache lacks.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/${{ env.LINUX_PACKAGE_ARCHIVES }}
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-${{ runner.os }}-
      - name: Install the WebView libraries
        run: |
          read -ra packages <<<"$LINUX_PACKAGES"
          archives="$HOME/$LINUX_PACKAGE_ARCHIVES"
          mkdir -p "$archives/partial"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            -o "Dir::Cache::Archives=$archives/" "${packages[@]}"
          sudo chown -R "$(id -u):$(id -g)" "$archives"
      # A cache is found by its exact key or, failing that, by the newest one
      # of the same job: after a change of the dependencies only what changed
      # is compiled. Lints and tests compile differently and keep their own.
      # A known limit: what an older set of dependencies left in the cache is
      # never removed, so the cache grows with every such change until the
      # platform evicts the oldest ones. Nothing stale is ever linked, only
      # carried along.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - run: npm ci
      # The application embeds the built frontend, so it is built before Rust.
      - run: npm run build
      - run: npm run rust:format:check
      - run: npm run rust:lint

  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Runners for macOS are scarce, and a job that gets none fails. The tests
        # therefore run there only before a change reaches main: for a pull
        # request into main and for main itself. Pull requests of the daily
        # development are tested on Linux and Windows.
        os: ${{ fromJSON((github.base_ref == 'main' || github.ref == 'refs/heads/main') && '["ubuntu-24.04", "macos-15", "windows-2025"]' || '["ubuntu-24.04", "windows-2025"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/${{ env.LINUX_PACKAGE_ARCHIVES }}
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-${{ runner.os }}-
      - name: Install the WebView libraries
        if: runner.os == 'Linux'
        run: |
          read -ra packages <<<"$LINUX_PACKAGES"
          archives="$HOME/$LINUX_PACKAGE_ARCHIVES"
          mkdir -p "$archives/partial"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            -o "Dir::Cache::Archives=$archives/" "${packages[@]}"
          sudo chown -R "$(id -u):$(id -g)" "$archives"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - run: npm ci
      - run: npm run test
      # The application embeds the built frontend, so it is built before Rust.
      - run: npm run build
      - run: npm run rust:test
      # The Rust tests regenerate the bindings; they must not differ from the
      # committed ones. One platform answers that.
      - if: runner.os == 'Linux'
        run: npm run bindings:check

  # The one check that says the gates on Linux passed. Whoever requires the
  # gates, as the protection of a branch does, asks for this name and need not
  # know how they are spread over jobs. The tests it waits for include the
  # other platforms.
  #
  # | The jobs it waits for                     | This job |
  # |-------------------------------------------|----------|
  # | all ended in success                      | passes   |
  # | one failed, was cancelled or was skipped  | fails    |
  # | none reported a result                    | fails    |
  quality:
    name: Quality gates (Linux)
    needs: [static, lint, tests]
    # Without this the job would be skipped when a gate fails, and a skipped
    # check counts as passed.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every gate passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          [ -n "$RESULTS" ] || { echo "no gate reported a result"; exit 1; }
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "a gate ended as: $result"; exit 1; }
          done

  dependencies:
    name: Dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Vulnerabilities, licences and sources of the Rust dependencies
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      - name: Vulnerabilities of the npm packages
        run: npm audit --audit-level=high
      - name: The copies under vendor/ are the published crates plus their patches
        run: tools/verify-vendor.sh
      - name: Rule files, schema files and test documents are the published files
        run: tools/verify-sources.sh
