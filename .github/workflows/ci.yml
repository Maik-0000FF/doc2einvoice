#
# Every quality gate on Linux, the tests on Windows as well and, before a change
# reaches main, on macOS, and the checks of the dependencies. Actions are pinned
# to a commit; the comment after each one names the release that commit belongs
# to.
#
# The gates are spread over jobs that run side by side, so that a change waits
# for the slowest of them and not for their sum. What `npm run verify` runs in
# one go locally is run here in parts: the static checks, the Rust lints and
# the tests.

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A runner builds once and is thrown away. Incremental compilation and debug
  # information only cost time and room in the cache there; neither changes
  # what is compiled, linted or tested.
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  NODE_VERSION: '24'
  # The licence checker, at the version the development shell provides.
  REUSE_VERSION: '6.2.0'

jobs:
  static:
    name: Static checks (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - name: Check the licence of every file
        run: |
          pipx install "reuse==$REUSE_VERSION"
          npm run license:check

  lint:
    name: Rust lints (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: ./.github/actions/prepare-rust-build
      - run: npm ci
      # The application embeds the built frontend, so it is built before Rust.
      - run: npm run build
      - run: npm run rust:format:check
      - run: npm run rust:lint

  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Runners for macOS are scarce, and a job that gets none fails. The tests
        # therefore run there only before a change reaches main: for a pull
        # request into main and for main itself. Pull requests of the daily
        # development are tested on Linux and Windows.
        os: ${{ fromJSON((github.base_ref == 'main' || github.ref == 'refs/heads/main') && '["ubuntu-24.04", "macos-15", "windows-2025"]' || '["ubuntu-24.04", "windows-2025"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: ./.github/actions/prepare-rust-build
      - run: npm ci
      - run: npm run test
      # The application embeds the built frontend, so it is built before Rust.
      - run: npm run build
      - run: npm run rust:test
      # The Rust tests regenerate the bindings; they must not differ from the
      # committed ones. One platform answers that.
      - if: runner.os == 'Linux'
        run: npm run bindings:check

  # The one check that says the gates on Linux passed. Whoever requires the
  # gates, as the protection of a branch does, asks for this name and need not
  # know how they are spread over jobs. The tests it waits for include the
  # other platforms.
  #
  # | The jobs it waits for                           | This job |
  # |-------------------------------------------------|----------|
  # | all ended in success                            | passes   |
  # | one failed, was cancelled or was skipped        | fails    |
  # | one reported no result, or an empty one         | fails    |
  # | there are none                                  | fails    |
  # | what is reported cannot be read                 | fails    |
  quality:
    name: Quality gates (Linux)
    needs: [static, lint, tests]
    # Without this the job would be skipped when a gate fails, and a skipped
    # check counts as passed.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The results arrive as one entry per job, read as such: every entry
      # has to say success, and there has to be at least one.
      - name: Every gate passed
        env:
          GATES: ${{ toJSON(needs) }}
        run: |
          jq --exit-status 'length > 0 and all(.[]; .result == "success")' <<<"$GATES"

  dependencies:
    name: Dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Vulnerabilities, licences and sources of the Rust dependencies
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      - name: Vulnerabilities of the npm packages
        run: npm audit --audit-level=high
      - name: The copies under vendor/ are the published crates plus their patches
        run: tools/verify-vendor.sh
      - name: Rule files, schema files and test documents are the published files
        run: tools/verify-sources.sh
