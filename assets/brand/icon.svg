SPDX-FileCopyrightText: Maik-0000FF
SPDX-License-Identifier: GPL-3.0-or-later

Application icon: a document page carrying a validated, structured invoice
(angle brackets for the XML, a check mark for the passed validation).

Drawn on the macOS icon grid: a 1024 px canvas with an 824 px body centred in
it, whose outline is a continuous-curvature rounded square (corner radius
185.4 px). The margin around the body stays transparent.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="doc2einvoice">
  <defs>
    <style>
      .ground { fill: #1d4ed8; }
      .page { fill: #ffffff; }
      .fold { fill: #bfd3ff; }
      .markup { fill: none; stroke: #1d4ed8; stroke-width: 22; stroke-linecap: round; stroke-linejoin: round; }
      .text-line { stroke: #8fb0f4; stroke-width: 13; stroke-linecap: round; }
      .valid { fill: none; stroke: #16a34a; stroke-width: 24; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <path class="ground" d="M383.41 100H640.59C722.19 100 763 100 806.92 113.89C854.88 131.34 892.66 169.12 910.11 217.08C924 261 924 301.81 924 383.41V640.59C924 722.19 924 763 910.11 806.92C892.66 854.88 854.88 892.66 806.92 910.11C763 924 722.19 924 640.59 924H383.41C301.81 924 261 924 217.08 910.11C169.12 892.66 131.34 854.88 113.89 806.92C100 763 100 722.19 100 640.59V383.41C100 301.81 100 261 113.89 217.08C131.34 169.12 169.12 131.34 217.08 113.89C261 100 301.81 100 383.41 100Z"/>

  <!-- The glyph is drawn in a 512 unit box and scaled onto the 824 px body. -->
  <g transform="translate(100 100) scale(1.609375)">
    <!-- The page is enlarged about its own centre (268, 256) and moved to the
         centre of the 512 unit box, so it fills more of the icon body. -->
    <g transform="translate(256 256) scale(1.35) translate(-268 -256)">
      <path class="page" d="M168 88h132l84 84v236a16 16 0 0 1-16 16H168a16 16 0 0 1-16-16V104a16 16 0 0 1 16-16z"/>
      <path class="fold" d="M300 88l84 84h-68a16 16 0 0 1-16-16z"/>
      <!-- Two lines of text: the page reads as a document without any lettering. -->
      <line class="text-line" x1="184" y1="198" x2="352" y2="198"/>
      <line class="text-line" x1="184" y1="228" x2="296" y2="228"/>
      <polyline class="markup" points="212,262 178,300 212,338"/>
      <polyline class="markup" points="324,262 358,300 324,338"/>
      <polyline class="valid" points="238,302 260,324 300,274"/>
    </g>
  </g>
</svg>
