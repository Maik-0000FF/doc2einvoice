[package]
name = "doc2einvoice"
description = "Convert documents into EN 16931 compliant e-invoices, entirely on the local machine."
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name, which
# Cargo requires on Windows.
name = "doc2einvoice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# Reads where the list of the contained libraries is generated.
serde_json.workspace = true
tauri-build = { version = "2", features = [] }

[dependencies]
clap.workspace = true
doc2einvoice-validation.workspace = true
serde.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
ts-rs.workspace = true

# What only Linux needs. The web view, at the version Tauri uses: only it
# tells when the process that draws the window is lost. And what the dialog
# about that loss takes: the languages the system prefers and a reader for the
# language files.
[target.'cfg(target_os = "linux")'.dependencies]
serde_json.workspace = true
sys-locale.workspace = true
webkit2gtk = { version = "2", features = ["v2_20"] }

[dev-dependencies]
tempfile = "3"
serde_json.workspace = true

[lints]
workspace = true
