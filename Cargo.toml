[workspace]
resolver = "3"
members = ["crates/*", "src-tauri", "xtask"]

[workspace.package]
version = "0.1.0"
authors = ["Maik-0000FF"]
license = "GPL-3.0-or-later"
repository = "https://github.com/Maik-0000FF/doc2einvoice"
edition = "2024"
publish = false

[workspace.dependencies]
# Attached documents are embedded in an invoice as Base64.
base64 = "0.22"
# Calendar dates of the invoice model, without time of day or time zone.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# The argument parser, without colours, suggestions and procedural macros: the
# command line is small and its output goes to terminals and pipes alike.
clap = { version = "4.6", default-features = false, features = ["std", "help", "usage", "error-context"] }
doc2einvoice-extract = { path = "crates/doc2einvoice-extract" }
doc2einvoice-model = { path = "crates/doc2einvoice-model" }
doc2einvoice-pdf = { path = "crates/doc2einvoice-pdf" }
doc2einvoice-schematron = { path = "crates/doc2einvoice-schematron" }
doc2einvoice-syntax = { path = "crates/doc2einvoice-syntax" }
doc2einvoice-validation = { path = "crates/doc2einvoice-validation" }
# The PDF interpreter, pinned exactly: it is young, and where it places a
# character decides what the reader finds on a page. A new version is taken
# only together with a new run of the reading tests.
hayro-interpret = "=0.9.0"
# Tells an IBAN from another account identifier, by its form and check digits.
iban_validate = "5.0"
# Compares place names without their accents.
unicode-normalization = "0.1"
# Checks the form of a VAT identifier for its country, offline.
vat_id_validator = { version = "0.2", default-features = false }
# Reads the objects of a PDF: the files embedded in it.
lopdf = { version = "0.47", default-features = false }
# The XML Schema processor, pinned exactly like the XPath engine below.
oxixml-schema = "=0.1.2"
# Writes XML as a stream, escaping text and attribute values.
quick-xml = "0.42"
roxmltree = "0.20"
# Amounts, prices, quantities and percentages as exact decimal numbers.
rust_decimal = { version = "1.43", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# Reads the licence a library states, an SPDX expression, for the list of
# libraries.
spdx = "0.13"
# Tells which languages the operating system prefers, for the texts the core
# shows without the user interface.
sys-locale = "0.3"
thiserror = "2"
# Reads the policy of the dependencies and the settings of the list of
# libraries, and writes the configuration of the tool that reads the licences.
toml = "1"
# Derives the TypeScript types of what crosses into the interface.
ts-rs = "11"
# The XPath engine is pinned exactly: two of its crates are replaced by the
# patched copies under vendor/ (see vendor/PATCHES.md), and those copies belong
# to precisely these versions.
xee-xpath = "=0.1.5"
# The parser of the XPath engine, at the version the engine itself uses: its
# syntax tree is read to see what the rule files search for.
xee-xpath-ast = "=0.1.4"
xot = "0.31"
# Cuts XML into its parts without building a tree; used to measure how deep a
# document is nested before anything else reads it.
xmlparser = "0.13"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"

[patch.crates-io]
xee-interpreter = { path = "vendor/xee-interpreter" }
xee-xpath-compiler = { path = "vendor/xee-xpath-compiler" }

# Dependencies are optimised in development builds too: the XPath engine is far
# too slow unoptimised to run the conformance corpus in the tests.
[profile.dev.package."*"]
opt-level = 2

# Panics unwind (the default) on purpose: the validation layer contains a panic
# of the XPath engine and reports it as a failed evaluation instead of letting
# it end the application.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
